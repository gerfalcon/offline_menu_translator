name: offline_menu_translator
description: "A new Flutter project to demonstrate the usage of on device AI models."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # pub-dev dependencies
  flutter_gemma: ^1.3.1 # The most important dependency
  # Inference engine for `.litertlm` models (Gemma 4, Qwen3, FastVLM +
  # all desktop). Engines are opt-in in flutter_gemma 1.x, so the core
  # package alone cannot run any model.
  flutter_gemma_litertlm: ^1.1.0

  image_picker: ^1.2.3
  flutter_markdown: ^0.7.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/gemma.png
